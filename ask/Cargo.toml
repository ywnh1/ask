[package]
name = "ask"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
anytomd = "1.3.0"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "unicode", "cargo", "color"] }
connect = { path = "../connect" }
figment = { version = "0.10.19", features = ["toml", "env"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
toml = "1.1.2"


